name: Monthly Home Depot Store Sync

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pyarrow

      - name: Run store sync
        id: sync
        # Exit code 2 means discovery came back empty for every source --
        # treated as a hard failure below rather than "zero new stores".
        run: |
          set +e
          python scraper/sync_stores.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit and push new stores directly to main
        id: commit
        if: steps.sync.outputs.exit_code == '0'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add new Home Depot store(s) found in monthly sync"
          file_pattern: stores.json

      - name: Build email report
        if: always()
        run: |
          COMMIT_URL=""
          if [ "${{ steps.commit.outputs.changes_detected }}" = "true" ]; then
            COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ steps.commit.outputs.commit_hash }}"
          fi
          python scraper/build_email_report.py --commit-url "$COMMIT_URL"

      - name: Upload sync report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: |
            sync_report.json
            email_report.html
          retention-days: 90

      - name: Email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.STORE_SYNC_SMTP_HOST }}
          server_port: ${{ secrets.STORE_SYNC_SMTP_PORT }}
          username: ${{ secrets.STORE_SYNC_SMTP_USER }}
          password: ${{ secrets.STORE_SYNC_SMTP_PASS }}
          subject: >-
            ${{ steps.sync.outputs.exit_code == '0' && 'Titan Data - Monthly Store Sync' ||
            'Titan Data - Monthly Store Sync FAILED' }}
          to: chance@titanwft.net
          from: Titan Data Sync
          html_body: file://email_report.html
